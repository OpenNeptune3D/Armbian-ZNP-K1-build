# ZNP-K1 Rockchip RK3328 quad core 1GB GBE eMMC USB3
BOARD_NAME="mkspi"
BOARDFAMILY="rockchip64"
BOOTCONFIG="mkspi-rk3328_defconfig"
KERNEL_TARGET="current,edge"
HAS_VIDEO_OUTPUT="no"
FULL_DESKTOP="no"
BOOT_LOGO="none"
BOOTFS_TYPE="fat"
MODULES="spidev"
PACKAGE_LIST_BOARD="build-essential usb-modeswitch"

# rockchip64 family hard-sets GOVERNOR="ondemand" after the board config is read,
# so override it late. schedutil ramps quickly for Klipper bursts while staying cool
# at idle on the fanless board (performance causes thermal throttling).
function post_family_config__znp_k1_schedutil_governor() {
	declare -g GOVERNOR="schedutil"
}
