# ZNP-K1 Rockchip RK3328 quad core 1GB GBE eMMC USB3
BOARD_NAME="mkspi"
BOARDFAMILY="rockchip64"
BOOTCONFIG="mkspi-rk3328_defconfig"
KERNEL_TARGET="current,edge"
HAS_VIDEO_OUTPUT="no"
FULL_DESKTOP="no"
BOOT_LOGO="none"
BOOTFS_TYPE="fat"
MODULES="spidev"
PACKAGE_LIST_BOARD="build-essential usb-modeswitch"

# Each OpenNept4une release image boots its own DTB. Pick it with ZNP_K1_VARIANT:
#   n4     - Neptune 4 / 4 Pro image      -> rk3328-znp-k1-v1x.dtb
#   n4plus - Neptune 4 Plus / Max image   -> rk3328-znp-k1-v2x.dtb
# All variant DTBs ship in linux-dtb; switch with fdtfile= in /boot/armbianEnv.txt:
#   rk3328-znp-k1-v1x.dtb          ZNP-K1 V1.x (Neptune 4 / 4 Pro)
#   rk3328-znp-k1-v2x.dtb          ZNP-K1 V2.0 (Neptune 4 Plus / Max)
#   rk3328-znp-k1-n4-v1.0.dtb      Neptune 4 / 4 Pro, ZNP-K1 V1.0
#   rk3328-znp-k1-n4-v1.1.dtb      Neptune 4 / 4 Pro, ZNP-K1 V1.1
#   rk3328-znp-k1-n4plus-n4max.dtb Neptune 4 Plus / Max, ZNP-K1 V1.1-V2.0
case "${ZNP_K1_VARIANT}" in
	n4) BOOT_FDT_FILE="rockchip/rk3328-znp-k1-v1x.dtb" ;;
	n4plus) BOOT_FDT_FILE="rockchip/rk3328-znp-k1-v2x.dtb" ;;
esac

# Kernel- and U-Boot-only builds don't need a variant; images do.
function post_family_tweaks__znp_k1_require_variant() {
	case "${ZNP_K1_VARIANT}" in
		n4 | n4plus) ;;
		*) exit_with_error "ZNP_K1_VARIANT must be n4 or n4plus" "got '${ZNP_K1_VARIANT}'" ;;
	esac
}

# rockchip64 family hard-sets GOVERNOR="ondemand" after the board config is read,
# so override it late. schedutil ramps quickly for Klipper bursts while staying cool
# at idle on the fanless board (performance causes thermal throttling).
function post_family_config__znp_k1_schedutil_governor() {
	declare -g GOVERNOR="schedutil"
}
